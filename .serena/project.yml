# name used to reference this project in Serena.
project_name: "serena"

# explicitly preferred retained language servers for this repository.
language_servers: ["python", "typescript", "html", "scss", "yaml"]

# detect additional applicable retained language servers lazily.
auto_detect_language_servers: true

# source-file encoding.
encoding: "utf-8"

# optional trusted shell command run before language-server initialisation.
activation_command:
activation_command_timeout: 180.0

# shared project overrides; null values inherit the global configuration.
line_ending:
symbol_info_budget:
read_only_memory_patterns: []
ignored_memory_patterns: []
ls_specific_settings: {}

# project/file policy.
ignore_all_files_in_gitignore: true
ignored_paths: []
read_only: false

# project-specific instructions appended to Serena's fixed ChatGPT policy.
initial_prompt: |
  {{ embed_memory("critical_info") }}

# language-server workspaces.
ls_workspace_folders:
  - "."
ls_additional_workspace_folders: []
