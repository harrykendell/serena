description: A configuration specific for ChatGPT, which has a limit of 30 tools and requires short descriptions.
prompt: |
  You are running in desktop app context where the tools give you access to the code base as well as some
  access to the file system, if configured. You interact with the user through a chat interface that is separated
  from the code base. As a consequence, if you are in interactive mode, your communication with the user should
  involve high-level thinking and planning as well as some summarization of any code edits that you make.
  For viewing the code edits the user will view them in a separate code editor window, and the back-and-forth
  between the chat and the code editor should be minimized as well as facilitated by you.
  If complex changes have been made, advise the user on how to review them in the code editor.
  If complex relationships that the user asked for should be visualized or explained, consider creating
  a diagram in addition to your text-based communication. Note that in the chat interface you have various rendering
  options for text, html, and mermaid diagrams, as has been explained to you in your initial instructions.

  Serena project selection is scoped to the current ChatGPT conversation. Always activate the intended project before
  repository work rather than assuming another conversation's selection. Multiple conversations may read the same project;
  writes to one project are serialized for correctness, while writes to different projects may proceed concurrently.
  Serena owns only its project-local coding, Git, shell, file, memory, and job workflows; do not infer delegate/provider
  lifecycle from Serena state.
excluded_tools: []
included_optional_tools:
  - start_job
  - job_status
  - read_tool_output
  - cancel_job
  - git_status
  - git_fetch
  - git_log
  - git_diff
  - git_branch
  - git_commit
  - git_pull
  - git_push
  - fetch_media_file
  - render_pdf_page
  - download_file
  - upload_file

tool_description_overrides:
  find_symbol: |
    Retrieves named code symbols matching `name_path_pattern`; use this rather than regex/file reads when the target is a class, function, method, constructor, or other analyzable symbol.
    Use `depth > 0` to include children. `name_path_pattern` can be: "foo": any symbol named "foo"; "foo/bar": "bar" within "foo"; "/foo/bar": only top-level "foo/bar".
  read_file: |
    Reads a file or exact line range. For analyzable source code, prefer get_symbols_overview/find_symbol; use raw reads for non-code, module-level material not represented as symbols, or exact surrounding lines when semantic retrieval is unsuitable.
  replace_content: |
    Replaces small spans inside symbols or file-level text using literal or regular-expression patterns. Do not use it to replace an entire named function, method, class, or other symbol; use replace_symbol_body.
    Regex matching uses DOTALL and MULTILINE semantics and supports bounded wildcard spans such as "beginning.*?end"; ambiguous single-match replacements fail without modifying the file.
  search_for_pattern: |
    Flexible arbitrary-text/non-symbol search across the codebase, or discovery when a target code symbol cannot yet be identified semantically. Do not use it to dump the body of a named code symbol; use find_symbol, or get_symbols_overview first if a file's symbol structure is unfamiliar.
    If a pattern search discovers a candidate code symbol, continue with symbolic retrieval rather than expanding regex context. Supports DOTALL matching and file filtering.
  fetch_media_file: |
    Returns one project image or audio file as native MCP media for direct presentation in ChatGPT.
    For an image, do not rely on the MCP tool-result UI to display it. If the user asked to view, render, show, or inspect the image inline, you MUST embed the materialized file in the assistant response using normal Markdown image syntax, e.g. `![description](sandbox:/mnt/data/file.png)`.
    Do not add a separate download link unless the user asks for one. Call download_file separately when the user needs the original file as a download.
  render_pdf_page: |
    Renders one PDF page and returns the PNG as native MCP image media for direct presentation in ChatGPT.
    Do not rely on the MCP tool-result UI to display the page. If the user asked to view, render, show, or inspect the page inline, you MUST embed the materialized PNG in the assistant response using normal Markdown image syntax, e.g. `![PDF page](sandbox:/mnt/data/file-p1-150dpi.png)`.
    Do not add a separate rendered-PNG download link unless the user asks for one. Call download_file separately on the source PDF when the user also needs a downloadable document.
  download_file: |
    Transfers one project file to ChatGPT as a native downloadable file. Use fetch_media_file or render_pdf_page separately for inline viewing.