<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f9fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10161d" media="(prefers-color-scheme: dark)">
  <title>Serena + Orchestrator dashboard</title>
  <link rel="icon" href="serena-logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="serena-icon-128.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="dashboard.js" defer data-cfasync="false"></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="brand">
        <div class="brand-marks" aria-hidden="true">
          <img class="brand-mark" src="serena-logo.svg" alt="">
          <img class="brand-mark" src="orchestrator-logo.svg" alt="">
        </div>
        <div class="brand-copy">
          <span class="brand-title">Serena + Orchestrator</span>
          <span class="brand-subtitle">MCP dashboard</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="connection" id="connection-state" data-state="loading">
          <span class="status-led" aria-hidden="true"></span>
          <span id="connection-label">Connecting</span>
          <span class="last-update" id="last-update"></span>
        </div>
        <button class="notification-button" id="notification-button" type="button" aria-label="Enable job notifications" aria-pressed="false" title="Enable job notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="shell-main">
      <section class="session-summary" aria-label="Session metadata">
        <dl class="metadata-grid">
          <div class="meta-item">
            <dt>Jobs</dt>
            <dd>
              <button class="meta-resource-button mono" id="jobs-button" type="button" aria-haspopup="dialog" aria-controls="jobs-dialog">
                <span id="running-jobs-count">0</span>/<span id="max-jobs-count">—</span>
              </button>
            </dd>
          </div>
          <div class="meta-item">
            <dt>Runtime</dt>
            <dd id="runtime-policy">—</dd>
          </div>
          <div class="meta-item">
            <dt>Version</dt>
            <dd class="mono" id="version">—</dd>
          </div>
          <div class="meta-item">
            <dt>Tools</dt>
            <dd>
              <button class="meta-resource-button" id="tools-button" type="button" aria-haspopup="dialog" aria-controls="resource-dialog">
                <span id="tool-count">—</span>
              </button>
            </dd>
          </div>
        </dl>
      </section>


      <section class="activity-workspace" aria-label="Agent activity">
        <div class="tabs activity-view-tabs" role="tablist" aria-label="Activity source">
          <button class="tab-button active" type="button" role="tab" data-activity-view-tab="serena" aria-selected="true" aria-controls="serena-activity-panel">Serena</button>
          <button class="tab-button" type="button" role="tab" data-activity-view-tab="orchestrator" aria-selected="false" aria-controls="orchestrator-activity-panel" tabindex="-1">Orchestrator</button>
        </div>

        <div class="activity-columns" id="activity-columns" data-active-view="serena">
          <section class="activity-section" id="serena-activity-panel" role="tabpanel" aria-labelledby="serena-activity-title">
            <div class="section-head">
              <div>
                <h2 class="section-title" id="serena-activity-title">Serena</h2>
                <p class="section-note">Retained ChatGPT sessions</p>
              </div>
              <span class="tab-count" id="serena-panel-count">0</span>
            </div>
            <div class="session-widgets" id="serena-widgets">
              <div class="empty-card">No Serena session activity recorded yet.</div>
            </div>
          </section>

          <section class="orchestrator-section" id="orchestrator-activity-panel" role="tabpanel" aria-labelledby="orchestrator-title">
            <div class="section-head">
              <div>
                <h2 class="section-title" id="orchestrator-title">Orchestrator</h2>
                <p class="section-note">Retained orchestrations</p>
              </div>
              <span class="tab-count" id="orchestrator-panel-count">0</span>
            </div>
            <div class="session-widgets" id="orchestrator-widgets">
              <div class="empty-card">No orchestration activity recorded yet.</div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <dialog class="memory-dialog resource-dialog" id="jobs-dialog" aria-labelledby="jobs-dialog-title">
      <div class="memory-dialog-head">
        <div>
          <div class="memory-dialog-kicker">Serena</div>
          <h2 id="jobs-dialog-title">Running jobs</h2>
        </div>
        <button class="memory-dialog-close" id="jobs-dialog-close" type="button" aria-label="Close running jobs">×</button>
      </div>
      <div class="jobs-dialog-content" id="jobs-dialog-content"></div>
    </dialog>

    <dialog class="memory-dialog resource-dialog" id="resource-dialog" aria-labelledby="resource-dialog-title">
      <div class="memory-dialog-head">
        <div>
          <div class="memory-dialog-kicker">Serena</div>
          <h2 id="resource-dialog-title">Active tools</h2>
        </div>
        <button class="memory-dialog-close" id="resource-dialog-close" type="button" aria-label="Close resources">×</button>
      </div>
      <div class="resource-dialog-content" id="resource-dialog-content"></div>
    </dialog>
  </div>
</body>
</html>
