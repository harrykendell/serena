# name used to reference this project in Serena.
project_name: "project_name"

# language servers explicitly preferred for this project. Supported values:
#   bash  cpp  html  json  latex  markdown  matlab
#   nix   python  scss  toml  typescript  yaml
# For C use cpp; for JavaScript use typescript; scss also handles Sass/CSS.
language_servers: ["python"]

# detect additional applicable retained language servers from project/source files.
# Detected servers are started lazily when semantic tools need them.
auto_detect_language_servers: true

# source-file encoding.
encoding: "utf-8"

# optional trusted shell command run before language-server initialisation.
# It is ignored unless this project is trusted by the global configuration.
activation_command:

# positive timeout in seconds for activation_command.
activation_command_timeout: 180.0

# line endings used when writing source files: null (inherit), "lf", "crlf", or "native".
line_ending:

# time budget in seconds for optional symbol hover/info retrieval; null inherits the global value.
symbol_info_budget:

# memory restrictions, expressed as regular-expression patterns.
read_only_memory_patterns: []
ignored_memory_patterns: []

# trusted language-server implementation overrides keyed by language-server id.
ls_specific_settings: {}

# whether project .gitignore rules are applied to Serena file discovery.
ignore_all_files_in_gitignore: true

# additional gitignore-style project-relative paths to ignore.
ignored_paths: []

# read-only projects expose retrieval but reject editing/mutation tools.
read_only: false

# project-specific instructions appended to Serena's fixed ChatGPT policy.
initial_prompt: ""

# project-relative folders exposed as language-server workspaces.
ls_workspace_folders:
  - "."

# additional workspace folders made visible to language servers for cross-package references.
# These may be absolute or project-relative and are not indexed as Serena project symbols.
ls_additional_workspace_folders: []
